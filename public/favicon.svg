<?xml version="1.0" encoding="UTF-8"?>
<!-- Project-appropriate SVG favicon for Smart Kitchen Pro -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Smart Kitchen logo">
  <title>Smart Kitchen Pro</title>
  <rect width="64" height="64" rx="10" fill="#0f172a" />
  <!-- bowl -->
  <path d="M10 36c0 9 6 16 22 16s22-7 22-16H10z" fill="#f59e0b"/>
  <!-- spoon -->
  <rect x="36" y="8" width="4" height="24" rx="2" transform="rotate(20 38 20)" fill="#fff" opacity="0.92"/>
  <!-- WiFi steam lines to indicate 'smart' -->
  <path d="M22 18c2-3 6-5 10-5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M24 22c1.5-2.4 4.5-4 7.5-4" stroke="#fff" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- small highlight on bowl -->
  <path d="M18 34c5 4 20 4 28 0" stroke="#000" stroke-width="0.6" opacity="0.12" fill="none" stroke-linecap="round"/>
</svg>
